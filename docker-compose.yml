services:
  # The image ships no /data, so Docker creates the named volume owned by root
  # and the engine - which drops to uid 10001 - cannot write its object store.
  # This runs once, prepares the directories and the auth token, and exits.
  engine-init:
    image: busybox:1.36
    container_name: glasshouse-engine-init
    user: "0:0"
    volumes:
      - engine-data:/data
    environment:
      # Substituted by compose from .env. The engine rejects anything under 32
      # characters, so a short fallback fails at startup rather than silently
      # running unauthenticated.
      TOKEN: ${HYDRA_LOCAL_TOKEN:?set HYDRA_LOCAL_TOKEN in .env (32+ characters)}
    command: >
      sh -c "mkdir -p /data/store /data/cache &&
             printf '%s' \"$$TOKEN\" > /data/auth-token &&
             chown -R 10001:10001 /data"

  # HydraDB open-source engine: the precision layer that holds the ontology.
  # Storage and compute are disaggregated; with CLOUD_PROVIDER=local the durable
  # store is a bind mount instead of S3, which is all a single node needs.
  engine:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: glasshouse-engine
    ports:
      - "7687:7687"   # Bolt 5.x (Neo4j-compatible)
      - "8443:8443"   # HTTPS query API
      - "9090:9090"   # admin: /readyz, /metrics
    volumes:
      # A named volume, deliberately not a bind mount. The image runs as uid
      # 10001 and a host directory arrives owned by whoever cloned the repo, so
      # a bind mount fails its first object-store write on any machine where
      # those differ - including a judge's. Docker gives a named volume to the
      # container's own user, so `docker compose up` works from a cold clone.
      - engine-data:/data
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    # No healthcheck: the image carries no curl, wget or nc, so any in-container
    # probe reports unhealthy forever while the engine serves fine. Readiness is
    # checked from the client instead - see glasshouse.graph.wait_until_ready.
    restart: unless-stopped
    depends_on:
      engine-init:
        condition: service_completed_successfully

volumes:
  engine-data:
