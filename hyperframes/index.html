<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glasshouse — Hyperframes Video Composition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #070709; color: #F3F4F6; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }

    #stage {
      width: 1920px;
      height: 1080px;
      position: relative;
      background: #070709;
      overflow: hidden;
    }

    .grid-layer {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .spotlight {
      position: absolute;
      width: 800px;
      height: 800px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 92, 57, 0.12) 0%, rgba(168, 85, 247, 0.04) 50%, transparent 70%);
      pointer-events: none;
    }

    .content-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px;
    }

    .title-banner {
      text-align: center;
      margin-bottom: 40px;
    }

    .title-banner h1 {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .title-banner span { color: #FF5C39; }

    .title-banner p {
      font-size: 24px;
      color: #9CA3AF;
      max-width: 800px;
      margin: 0 auto;
    }

    .graph-stage {
      width: 1100px;
      height: 520px;
      background: #08080B;
      border: 1px solid rgba(255, 92, 57, 0.3);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 92, 57, 0.15);
      position: relative;
      overflow: hidden;
    }

    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <!-- Hyperframes Native Composition Stage -->
  <div id="stage" data-composition-id="glasshouse-demo" data-start="0" data-width="1920" data-height="1080">
    <div class="grid-layer" data-start="0" data-duration="8" data-track-index="0"></div>
    <div class="spotlight" data-start="0" data-duration="8" data-track-index="0"></div>

    <div class="content-container">
      <div class="title-banner clip" id="video-header" data-start="0" data-duration="8" data-track-index="1">
        <h1>An enterprise ontology <span>you can see through.</span></h1>
        <p>Unifying identities & arbitrating contradictions across enterprise documents.</p>
      </div>

      <div class="graph-stage clip" id="video-canvas-box" data-start="1" data-duration="7" data-track-index="2">
        <canvas id="hyper-canvas"></canvas>
      </div>
    </div>

    <!-- GSAP Animation Driver for Hyperframes Headless Renderer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      // Hyperframes Timeline Registration
      const tl = gsap.timeline({ paused: true });
      tl.from("#video-header", { opacity: 0, y: 60, duration: 1 }, 0);
      tl.from("#video-canvas-box", { opacity: 0, scale: 0.9, duration: 1.2, ease: "power3.out" }, 0.8);
      
      window.__timelines = window.__timelines || {};
      window.__timelines["glasshouse-demo"] = tl;

      // Canvas Rendering Engine for Hyperframes Seekable Video Frames
      const canvas = document.getElementById('hyper-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        canvas.width = 1100;
        canvas.height = 520;

        function drawFrame() {
          ctx.clearRect(0, 0, 1100, 520);
          ctx.fillStyle = '#08080B';
          ctx.fillRect(0, 0, 1100, 520);

          // Draw Graph Connections
          ctx.strokeStyle = 'rgba(255, 92, 57, 0.4)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(350, 260); ctx.lineTo(480, 200);
          ctx.lineTo(600, 290); ctx.lineTo(750, 260);
          ctx.stroke();

          // Nodes
          ctx.beginPath(); ctx.arc(350, 260, 6, 0, Math.PI*2); ctx.fillStyle='#5FD3C4'; ctx.fill();
          ctx.beginPath(); ctx.arc(480, 200, 7, 0, Math.PI*2); ctx.fillStyle='#A855F7'; ctx.fill();
          ctx.beginPath(); ctx.arc(600, 290, 8, 0, Math.PI*2); ctx.fillStyle='#F0C674'; ctx.fill();
          ctx.beginPath(); ctx.arc(750, 260, 14, 0, Math.PI*2); ctx.fillStyle='#FF5C39'; ctx.fill();

          requestAnimationFrame(drawFrame);
        }
        drawFrame();
      }
    </script>
  </div>

</body>
</html>
