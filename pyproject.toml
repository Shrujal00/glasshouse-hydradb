[project]
name = "glasshouse"
version = "0.1.0"
description = "A queryable enterprise ontology with visible reasoning, built on HydraDB"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
