<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glasshouse — Why HydraDB Hyperframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; }
    body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; }
    #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; background: #07070a; }
    canvas { display: block; width: 100%; height: 100%; }
    .replay { position: absolute; right: 2.4%; bottom: 3.8%; z-index: 2; padding: 7px 11px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; color: #a1a1aa; background: rgba(8,8,12,.72); font: 500 clamp(8px, .75vw, 11px) "Fira Code", monospace; cursor: pointer; backdrop-filter: blur(10px); }
    .replay:hover { color: #fff; border-color: rgba(255,92,57,.55); }
  </style>
</head>
<body>
  <main id="stage" data-composition-id="glasshouse-why-hydradb" data-start="0" data-width="1280" data-height="720" data-fps="30" data-duration="12">
    <canvas id="composition" width="1280" height="720" aria-label="Animated explanation of how Glasshouse uses HydraDB"></canvas>
    <button class="replay" id="replay" type="button">↻ REPLAY</button>
  </main>

  <script>
    const canvas = document.getElementById('composition');
    const ctx = canvas.getContext('2d');
    const W = 1280;
    const H = 720;
    const FPS = 30;
    const DURATION = 12;
    const ORANGE = '#ff5c39';
    const MINT = '#5fd3c4';
    const PURPLE = '#a855f7';
    const GOLD = '#f0c674';
    const WHITE = '#f4f4f5';
    const MUTED = '#8b8b96';
    const DIM = '#4c4c57';
    const params = new URLSearchParams(location.search);
    let startedAt = performance.now();
    let manualFrame = params.has('frame') ? Number(params.get('frame')) : null;

    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const smooth = value => { const t = clamp(value); return t * t * (3 - 2 * t); };
    const sceneAlpha = (time, start, end, feather = .45) => smooth((time - start) / feather) * smooth((end - time) / feather);

    function font(size, weight = 500, family = 'Inter') {
      ctx.font = `${weight} ${size}px ${family === 'mono' ? '"Fira Code", monospace' : family === 'heading' ? '"Plus Jakarta Sans", Inter, sans-serif' : 'Inter, sans-serif'}`;
    }

    function text(value, x, y, size, color = WHITE, weight = 500, family = 'Inter', alpha = 1, align = 'left') {
      ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; font(size, weight, family); ctx.fillText(value, x, y); ctx.restore();
    }

    function roundRect(x, y, width, height, radius, fill, stroke = null, alpha = 1) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.roundRect(x, y, width, height, radius);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.restore();
    }

    function line(x1, y1, x2, y2, color, width = 1, alpha = 1) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
    }

    function dot(x, y, radius, color, alpha = 1, glow = 0) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
      ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }

    function header(time) {
      dot(54, 48, 5, ORANGE, 1, 12);
      text('GLASSHOUSE', 70, 53, 13, WHITE, 700, 'heading');
      text('WHY THE GRAPH IS THE PRODUCT', 1162, 53, 10, DIM, 500, 'mono', 1, 'right');
      line(54, 72, 1226, 72, '#ffffff', 1, .07);
      const chapter = time < 3 ? ['01', 'THE PROBLEM'] : time < 6 ? ['02', 'THE FOUNDATION'] : time < 9 ? ['03', 'THE JUDGMENT'] : ['04', 'THE DIFFERENCE'];
      text(chapter[0], 54, 108, 11, ORANGE, 600, 'mono');
      text(chapter[1], 84, 108, 11, MUTED, 500, 'mono');
      line(54, 676, 1226, 676, '#ffffff', 1, .08);
      line(54, 676, 54 + 1172 * clamp(time / DURATION), 676, ORANGE, 2, .9);
      text(`${String(Math.min(12, Math.floor(time))).padStart(2, '0')}:00`, 1226, 701, 9, DIM, 500, 'mono', 1, 'right');
    }

    function fragmentCard(x, y, width, source, claim, tone, alpha, rotation = 0) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
      roundRect(0, 0, width, 88, 10, 'rgba(14,15,20,.93)', 'rgba(255,255,255,.11)', alpha);
      dot(18, 19, 3, tone, alpha, 8); text(source, 30, 23, 9, MUTED, 600, 'mono', alpha);
      text(claim, 18, 53, 14, WHITE, 600, 'Inter', alpha); text('detached fragment', 18, 73, 9, DIM, 500, 'mono', alpha); ctx.restore();
    }

    function sceneProblem(time) {
      const a = sceneAlpha(time, 0, 3.15); const enter = smooth(time / .8);
      text('Search finds fragments.', 54, 201, 42, WHITE, 700, 'heading', a * enter);
      text('It cannot establish truth.', 54, 252, 42, ORANGE, 700, 'heading', a * enter);
      text('Nine systems disagree on names, owners, and deadlines.', 56, 294, 15, MUTED, 400, 'Inter', a * enter);
      const drift = Math.sin(time * 1.4) * 5;
      fragmentCard(666, 151 + drift, 224, 'SLACK · 09:41', 'Priya owns billing', '#f43f5e', a, -.035);
      fragmentCard(935, 190 - drift, 236, 'JIRA · TICKET 184', 'Owner: Sam R.', '#3b82f6', a, .025);
      fragmentCard(714, 303 - drift, 250, 'GMAIL · MAR 01', 'Ship on March 18', '#ef4444', a, .018);
      fragmentCard(982, 344 + drift, 210, 'CONFLUENCE', 'Due March 24', PURPLE, a, -.028);
      fragmentCard(809, 464 + drift * .5, 232, 'LINEAR · ENG-29', '@sam_r assigned', '#5e6ad2', a, .02);
      text('retrieval ≠ reasoning', 1054, 609, 11, ORANGE, 600, 'mono', a, 'right');
    }

    const graphNodes = [
      { x: 817, y: 191, label: 'Slack', color: '#f43f5e' }, { x: 1022, y: 190, label: 'Jira', color: '#3b82f6' },
      { x: 1133, y: 324, label: 'Confluence', color: PURPLE }, { x: 1026, y: 490, label: 'Sam R.', color: GOLD },
      { x: 807, y: 482, label: '@sam_r', color: MINT }, { x: 708, y: 333, label: 'Gmail', color: '#ef4444' },
      { x: 925, y: 337, label: 'ENTITY 4902', color: ORANGE, hero: true }
    ];
    const graphEdges = [[0,6], [1,6], [2,6], [3,6], [4,6], [5,6], [0,1], [2,3], [4,5]];

    function drawGraph(alpha, reveal) {
      graphEdges.forEach(([from, to], i) => {
        const source = graphNodes[from]; const target = graphNodes[to]; const edgeReveal = smooth(reveal * 1.5 - i * .055);
        line(source.x, source.y, source.x + (target.x - source.x) * edgeReveal, source.y + (target.y - source.y) * edgeReveal, to === 6 ? ORANGE : '#ffffff', to === 6 ? 1.5 : 1, alpha * (to === 6 ? .45 : .1));
      });
      graphNodes.forEach((node, i) => {
        const nodeReveal = smooth(reveal * 1.6 - i * .04);
        if (node.hero) { dot(node.x, node.y, 34 * nodeReveal, ORANGE, alpha * .08, 24); dot(node.x, node.y, 10 * nodeReveal, ORANGE, alpha, 20); }
        else dot(node.x, node.y, 6 * nodeReveal, node.color, alpha, 12);
        text(node.label.toUpperCase(), node.x, node.y + (node.hero ? 54 : 26), 9, node.hero ? ORANGE : MUTED, 600, 'mono', alpha * nodeReveal, 'center');
      });
    }

    function sceneFoundation(time) {
      const a = sceneAlpha(time, 2.85, 6.15); const local = clamp((time - 3) / 2.3);
      text('HydraDB is the', 54, 201, 42, WHITE, 700, 'heading', a); text('memory underneath.', 54, 252, 42, MINT, 700, 'heading', a);
      text('It turns fragments into durable, connected context.', 56, 294, 15, MUTED, 400, 'Inter', a);
      [['ENTITY', 'one real thing'], ['RELATIONSHIP', 'how facts connect'], ['PROVENANCE', 'where each fact came from']].forEach((item, index) => {
        const y = 376 + index * 66; dot(59, y - 3, 4, MINT, a, 8); text(item[0], 75, y, 10, MINT, 600, 'mono', a); text(item[1], 182, y, 13, WHITE, 500, 'Inter', a);
      });
      drawGraph(a, local); text('HYDRADB · PERSISTENT CONTEXT GRAPH', 1167, 609, 10, MINT, 600, 'mono', a, 'right');
    }

    function pipelineRow(y, number, title, detail, color, alpha, progress) {
      const rowAlpha = alpha * smooth(progress); roundRect(672, y, 512, 78, 10, 'rgba(14,15,20,.82)', 'rgba(255,255,255,.1)', rowAlpha);
      text(number, 694, y + 31, 10, color, 600, 'mono', rowAlpha); text(title, 744, y + 31, 15, WHITE, 600, 'heading', rowAlpha);
      text(detail, 744, y + 54, 11, MUTED, 400, 'Inter', rowAlpha); dot(1150, y + 39, 5, color, rowAlpha, 12);
    }

    function sceneJudgment(time) {
      const a = sceneAlpha(time, 5.85, 9.15); const local = clamp((time - 6) / 2.2);
      text('Glasshouse is the', 54, 201, 42, WHITE, 700, 'heading', a); text('judgment on top.', 54, 252, 42, ORANGE, 700, 'heading', a);
      text('It makes the decisions retrieval alone cannot.', 56, 294, 15, MUTED, 400, 'Inter', a);
      roundRect(54, 360, 501, 156, 12, 'rgba(255,92,57,.055)', 'rgba(255,92,57,.22)', a);
      text('WHO OWNS THE BILLING API?', 78, 390, 10, ORANGE, 600, 'mono', a); text('Sam Ratnaparkhi', 78, 430, 25, WHITE, 700, 'heading', a);
      text('Due March 24, 2026', 78, 460, 15, GOLD, 600, 'Inter', a); line(78, 481, 525, 481, '#ffffff', 1, a * .09);
      text('Confluence ADR #3491 · 99.8% confidence', 78, 502, 10, MUTED, 500, 'mono', a);
      pipelineRow(150, '01', 'RESOLVE', 'Sam, S. Ratnaparkhi, and @sam_r become one.', PURPLE, a, local * 2.2);
      pipelineRow(253, '02', 'ARBITRATE', 'The latest authoritative evidence wins.', GOLD, a, local * 2.2 - .34);
      pipelineRow(356, '03', 'CITE', 'The answer keeps an exact path to its source.', ORANGE, a, local * 2.2 - .68);
      pipelineRow(459, '04', 'ABSTAIN', 'No evidence means no invented answer.', MINT, a, local * 2.2 - 1.02);
      text('GLASSHOUSE · RESOLUTION ENGINE', 1167, 609, 10, ORANGE, 600, 'mono', a, 'right');
    }

    function sceneDifference(time) {
      const a = sceneAlpha(time, 8.85, 12.4, .5); const local = clamp((time - 9) / 2.5);
      text('Without HydraDB,', 54, 201, 44, WHITE, 700, 'heading', a); text('nothing connects.', 54, 255, 44, ORANGE, 700, 'heading', a);
      text('No entity memory. No conflict history. No evidence path.', 56, 299, 15, MUTED, 400, 'Inter', a);
      const split = smooth(local * 1.4);
      roundRect(54, 363, 520, 181, 14, 'rgba(14,15,20,.72)', 'rgba(255,255,255,.09)', a);
      text('RAW RETRIEVAL', 78, 394, 10, DIM, 600, 'mono', a); text('“Probably Sam. Due Friday.”', 78, 440, 21, '#777780', 600, 'heading', a);
      text('unsupported · disconnected · unprovable', 78, 486, 10, '#5d5d66', 500, 'mono', a); text('×', 526, 476, 36, '#5d5d66', 400, 'Inter', a, 'center');
      roundRect(624, 147, 560, 397, 16, 'rgba(255,92,57,.06)', 'rgba(255,92,57,.34)', a * split);
      text('HYDRADB + GLASSHOUSE', 652, 181, 10, ORANGE, 600, 'mono', a * split); text('One answer.', 652, 247, 39, WHITE, 700, 'heading', a * split);
      text('Every source.', 652, 292, 39, ORANGE, 700, 'heading', a * split); line(652, 329, 1156, 329, '#ffffff', 1, a * split * .1);
      text('SAM RATNAPARKHI', 652, 370, 11, MUTED, 600, 'mono', a * split); text('owns billing · due Mar 24', 652, 407, 22, WHITE, 600, 'heading', a * split);
      text('↳ Confluence ADR #3491', 652, 453, 11, GOLD, 500, 'mono', a * split); text('↳ identity path: 3 aliases → Entity 4902', 652, 480, 11, MINT, 500, 'mono', a * split);
      roundRect(1038, 475, 118, 38, 19, ORANGE, null, a * split); text('PROVEN', 1097, 499, 10, '#09090b', 700, 'mono', a * split, 'center');
    }

    function renderAt(time) {
      ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#07070a'; ctx.fillRect(0, 0, W, H);
      const glow = ctx.createRadialGradient(880, 350, 0, 880, 350, 520); glow.addColorStop(0, 'rgba(255,92,57,.07)'); glow.addColorStop(.55, 'rgba(168,85,247,.018)'); glow.addColorStop(1, 'rgba(7,7,10,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
      for (let x = 0; x <= W; x += 40) line(x, 0, x, H, '#ffffff', 1, .022);
      for (let y = 0; y <= H; y += 40) line(0, y, W, y, '#ffffff', 1, .022);
      sceneProblem(time); sceneFoundation(time); sceneJudgment(time); sceneDifference(time); header(time);
    }

    function tick(now) { const time = manualFrame === null ? ((now - startedAt) / 1000) % DURATION : manualFrame / FPS; renderAt(time); requestAnimationFrame(tick); }
    window.renderFrame = frame => { manualFrame = clamp(Number(frame), 0, DURATION * FPS - 1); renderAt(manualFrame / FPS); return true; };
    window.playComposition = () => { manualFrame = null; startedAt = performance.now(); };
    window.__timelines = window.__timelines || {};
    window.__timelines['glasshouse-why-hydradb'] = { renderFrame: window.renderFrame, fps: FPS, duration: DURATION };
    if (params.has('render')) document.getElementById('replay').hidden = true;
    document.getElementById('replay').addEventListener('click', window.playComposition);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
